    <text x="70" y="76"><tspan fill="#ea5b0c">public</tspan> <tspan fill="#ea5b0c">class</tspan> <tspan fill="#f2cc8f">SobreMim</tspan> {</text>
    <text x="70" y="124">    <tspan fill="#ea5b0c">private final</tspan> <tspan fill="#c39bdb">String</tspan>   <tspan fill="#e6edf3">cargo</tspan>   = <tspan fill="#a5c9a1">"Desenvolvedor Back-end Java"</tspan>;</text>
    <text x="70" y="148">    <tspan fill="#ea5b0c">private final</tspan> <tspan fill="#c39bdb">String[]</tspan> <tspan fill="#e6edf3">stack</tspan>   = {</text>
    <text x="70" y="172">            <tspan fill="#a5c9a1">"Java"</tspan>, <tspan fill="#a5c9a1">"Spring Boot"</tspan>, <tspan fill="#a5c9a1">"Spring Data JPA"</tspan>,</text>
    <text x="70" y="196">            <tspan fill="#a5c9a1">"Spring Security (JWT)"</tspan>, <tspan fill="#a5c9a1">"PostgreSQL"</tspan>, <tspan fill="#a5c9a1">"Docker"</tspan>, <tspan fill="#a5c9a1">"AWS"</tspan></text>
    <text x="70" y="220">    };</text>
    <text x="70" y="244">    <tspan fill="#ea5b0c">private final</tspan> <tspan fill="#c39bdb">String</tspan>   <tspan fill="#e6edf3">idiomas</tspan> = <tspan fill="#a5c9a1">"Português (BR) | English (learning)"</tspan>;</text>
    <text x="70" y="292">    <tspan fill="#ea5b0c">public</tspan> <tspan fill="#c39bdb">String</tspan> <tspan fill="#f2cc8f">biografia</tspan>() {</text>
    <text x="70" y="316">        <tspan fill="#ea5b0c">return</tspan> <tspan fill="#a5c9a1">"""</tspan></text>
    <text x="70" y="340">                <tspan fill="#a5c9a1">Olá! Como vai? Me chamo Vítor Hugo, tenho 21 anos e sou do</tspan></text>
    <text x="70" y="364">                <tspan fill="#a5c9a1">interior de São Paulo. No momento curso Análise e Desenvolvimento</tspan></text>
    <text x="70" y="388">                <tspan fill="#a5c9a1">de Sistemas (ADS) na Anhanguera e também faço cursos</tspan></text>
    <text x="70" y="412">                <tspan fill="#a5c9a1">complementares, nos quais aplico e aprimoro meus conhecimentos</tspan></text>
    <text x="70" y="436">                <tspan fill="#a5c9a1">em projetos práticos.</tspan></text>
    <text x="70" y="460">                <tspan fill="#a5c9a1">"""</tspan>;</text>
    <text x="70" y="484">    }</text>
    <text x="70" y="532">    <tspan fill="#ea5b0c">public</tspan> <tspan fill="#c39bdb">String</tspan> <tspan fill="#f2cc8f">filosofia</tspan>() {</text>
    <text x="70" y="556">        <tspan fill="#ea5b0c">return</tspan> <tspan fill="#a5c9a1">"Se alguém construiu, quem sou eu para não aprender?"</tspan>;</text>
    <text x="70" y="580">    }</text>
